<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donor Registration - LifeLink</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#4682B4;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
}

.section-title{
    text-align:center;
    margin-top:50px;
    margin-bottom:30px;
    color:#4682B4;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}

.btn-custom{
    background:#4682B4;
    color:white;
    border:none;
}

.btn-custom:hover{
    background:#5a9bd5;
}
</style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand" href="index.html">Organ Donation Management</a>

<div class="ms-auto">
    <a href="index.html" class="btn btn-light">
        Home
    </a>
</div>

</div>
</nav>

<!-- Donor Registration -->
<div class="container">

<h2 class="section-title">Donor Registration</h2>

<div class="card p-4">

<form id="donorForm">

<div class="row">

<!-- Full Name -->
<div class="col-md-6 mb-3">
<label>Full Name</label>
<input type="text" class="form-control" id="full_name" placeholder="Enter Name">
</div>

<!-- Age -->
<div class="col-md-6 mb-3">
<label>Age</label>
<input type="number" class="form-control" id="age">
</div>

<!-- Blood Group -->
<div class="col-md-6 mb-3">
<label>Blood Group</label>
<select class="form-control" id="blood_group">
<option>A+</option>
<option>B+</option>
<option>AB+</option>
<option>O+</option>
<option>A-</option>
<option>B-</option>
<option>AB-</option>
<option>O-</option>
</select>
</div>

<!-- Organ -->
<div class="col-md-6 mb-3">
<label>Organ Willing to Donate</label>
<select class="form-control" id="organ">
<option>Kidney</option>
<option>Liver</option>
<option>Heart</option>
<option>Lungs</option>
<option>Pancreas</option>
<option>Eyes</option>
</select>
</div>

<!-- Medical History -->
<div class="col-md-6 mb-3">
<label>Medical Conditions (Select if YES)</label>

<div>
  <input type="checkbox" id="hiv"> HIV<br>
  <input type="checkbox" id="cancer"> Cancer<br>
  <input type="checkbox" id="bleeding"> Bleeding Disorders<br>
  <input type="checkbox" id="diabetes"> Diabetes<br>
</div>

<!-- Hidden field to store result -->
<input type="hidden" id="medicalHistory" name="medicalHistory">
</div>

<!-- Donation Type -->
<div class="col-md-6 mb-3">
<label>Donation Type</label>
<select class="form-control" id="donation_type">
<option>Live Donor</option>
<option>Deceased Donor</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Phone Number</label>
<input type="text" class="form-control" id="phone" required>
</div>

</div>

<button type="submit" class="btn btn-custom mt-3">
Register Donor
</button>

</form>

</div>
</div>
<script>

document.getElementById("donorForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    // Medical status logic
    let medical = "Healthy";

    if (
        document.getElementById("hiv").checked ||
        document.getElementById("cancer").checked ||
        document.getElementById("bleeding").checked ||
        document.getElementById("diabetes").checked
    ) {
        medical = "Unhealthy";
    }

    // ✅ FIXED DATA (matches Flask backend exactly)
    const data = {
        full_name: document.getElementById("full_name").value,
        age: document.getElementById("age").value,
        blood_group: document.getElementById("blood_group").value,

        organ: document.getElementById("organ").value,   // ✅ FIXED NAME

        urgency_level: document.getElementById("donation_type").value, // mapped from dropdown

        medical_condition: medical,   // ✅ FIXED NAME

        phone: document.getElementById("phone").value
    };

    try {

        const res = await fetch(
            "http://127.0.0.1:5000/api/donors",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await res.json();

        if(res.ok){

            alert("Donor Registered Successfully!");

            // Clear form
            document.getElementById("donorForm").reset();

            // Redirect
            window.location.href = "total_donors.html";
        }
        else{
            alert("Error: " + result.error);
        }

    } catch(err){
        console.log(err);
        alert("Server Connection Failed");
    }

});

</script>

</body>
</html>
