<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipient Registration - LifeLink</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#4682B4;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
}

.section-title{
    text-align:center;
    margin-top:50px;
    margin-bottom:30px;
    color:#4682B4;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.1);
}

.btn-custom{
    background:#4682B4;
    color:white;
    border:none;
}

.btn-custom:hover{
    background:#5a9bd5;
}
</style>

</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand" href="index.html">Organ Donation Management</a>

<div class="ms-auto">
    <a href="index.html" class="btn btn-light">
        Home
    </a>
</div>

</div>
</nav>

<!-- Recipient Registration -->
<div class="container">

<h2 class="section-title">Recipient Registration</h2>

<div class="card p-4">

<form id="recipientForm">

<div class="row">

<!-- Patient Name -->
<div class="col-md-6 mb-3">
<label>Patient Name</label>
<input type="text"
class="form-control"
id="full_name"
placeholder="Enter Name"
required>
</div>

<!-- Age -->
<div class="col-md-6 mb-3">
<label>Age</label>
<input type="number"
class="form-control"
id="age"
required>
</div>

<!-- Blood Group -->
<div class="col-md-6 mb-3">
<label>Blood Group</label>
<select class="form-control" id="blood_group">
<option>A+</option>
<option>B+</option>
<option>AB+</option>
<option>O+</option>
<option>A-</option>
<option>B-</option>
<option>AB-</option>
<option>O-</option>
</select>
</div>

<!-- Required Organ -->
<div class="col-md-6 mb-3">
<label>Required Organ</label>
<select class="form-control" id="required_organ">
<option>Kidney</option>
<option>Liver</option>
<option>Heart</option>
<option>Lungs</option>
</select>
</div>

<!-- Priority -->
<div class="col-md-6 mb-3">
<label>Priority Level</label>
<select class="form-control" id="urgency_level">
<option>Critical</option>
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<!-- Medical Condition -->
<div class="col-md-6 mb-3">
<label>Medical Condition</label>
<input type="text"
class="form-control"
id="medical_condition"
placeholder="Enter Medical Condition"
required>
</div>

<!-- Phone -->
<div class="col-md-6 mb-3">
<label>Phone Number</label>
<input type="text"
class="form-control"
id="phone"
placeholder="Enter Phone Number"
required>
</div>

<!-- Hospital -->
<div class="col-md-6 mb-3">
<label>Hospital Name</label>
<input type="text"
class="form-control"
id="hospital_name">
</div>

<!-- Urgency Score -->
<div class="col-md-6 mb-3">
<label>Medical Urgency Score</label>
<input type="number"
class="form-control"
id="urgency_score">
</div>

</div>

<button type="submit" class="btn btn-custom mt-3">
Submit Request
</button>

</form>

</div>
</div>

<script>

document.getElementById("recipientForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = {
        full_name:
            document.getElementById("full_name").value,

        age:
            document.getElementById("age").value,

        blood_group:
            document.getElementById("blood_group").value,

        required_organ:
            document.getElementById("required_organ").value,

        urgency_level:
            document.getElementById("urgency_level").value,

        medical_condition:
            document.getElementById("medical_condition").value,

        phone:
            document.getElementById("phone").value
    };

    try {

        const res = await fetch(
            "http://127.0.0.1:5000/api/recipients",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await res.json();

        if(res.ok){

            alert("Recipient Registered Successfully!");

            document
            .getElementById("recipientForm")
            .reset();

            window.location.href =
            "total_recipients.html";
        }

        else{
            alert("Error: " + result.error);
        }

    } catch(err){

        console.log(err);
        alert("Server Connection Failed");
    }

});

</script>

</body>
</html>
