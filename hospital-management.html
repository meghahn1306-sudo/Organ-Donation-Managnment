<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#4682B4;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
    font-size:28px;
}

.heading{
    text-align:center;
    margin:40px 0;
    color:#4682B4;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.btn-custom{
    background:#4682B4;
    color:white;
    border:none;
}

.btn-custom:hover{
    background:#5a9bd5;
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container">
    <a class="navbar-brand" href="index.html">Organ Donation Management</a>
    <a href="index.html" class="btn btn-light">🏠 Home</a>
</div>
</nav>

<div class="container">
<h2 class="heading">Registered Hospitals</h2>
<div class="row g-4" id="hospitalContainer"></div>
</div>

<script>

let hospitalState = {};

// check admin
const isAdmin =
    new URLSearchParams(window.location.search).get("admin") === "true";


async function loadHospitals() {
    try {
        const res = await fetch("http://127.0.0.1:5000/api/hospitals");
        const hospitals = await res.json();

        const container = document.getElementById("hospitalContainer");
        container.innerHTML = "";

        hospitals.forEach(h => {

            const id = h.hospital_id;

            const icu = h.icu_beds + (hospitalState[id]?.icu_beds || 0);
            const doc = h.doctors + (hospitalState[id]?.doctors || 0);

            container.innerHTML += `
            <div class="col-md-4">
            <div class="card p-4">

                <h4>${h.hospital_name}</h4>

                <p><strong>Location:</strong> ${h.location}</p>

                <p>
                <strong>ICU Beds:</strong>

                ${isAdmin ? `
                    <button class="btn btn-sm btn-danger"
                        onclick="changeValue(${id}, 'icu_beds', -1)">-</button>

                    ${icu}

                    <button class="btn btn-sm btn-success"
                        onclick="changeValue(${id}, 'icu_beds', 1)">+</button>
                ` : icu}
                </p>

                <p>
                <strong>Doctors:</strong>

                ${isAdmin ? `
                    <button class="btn btn-sm btn-danger"
                        onclick="changeValue(${id}, 'doctors', -1)">-</button>

                    ${doc}

                    <button class="btn btn-sm btn-success"
                        onclick="changeValue(${id}, 'doctors', 1)">+</button>
                ` : doc}
                </p>

                <p><strong>Specialization:</strong> ${h.specialization}</p>
                <p><strong>Contact:</strong> ${h.contact_number}</p>

                ${isAdmin ? `
                    <button class="btn btn-success w-100"
                        onclick="updateHospital(${id}, ${icu}, ${doc})">
                        Update
                    </button>
                ` : `
                    <a href="tel:${h.contact_number}" class="btn btn-custom w-100">
                        Contact Hospital
                    </a>
                `}

            </div>
            </div>
            `;
        });

    } catch (err) {
        console.error(err);
    }
}


// temporary change store
function changeValue(id, field, value) {

    if (!hospitalState[id]) {
        hospitalState[id] = { icu_beds: 0, doctors: 0 };
    }

    hospitalState[id][field] += value;

    loadHospitals();
}


// update backend
async function updateHospital(id, icu, doctors) {

    const updated = hospitalState[id] || {};

    await fetch(`http://127.0.0.1:5000/api/hospitals/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            icu_beds: icu + (updated.icu_beds || 0),
            doctors: doctors + (updated.doctors || 0)
        })
    });

    alert("Updated successfully!");

    hospitalState[id] = {};
    loadHospitals();
}

window.onload = loadHospitals;

</script>

</body>
</html>
