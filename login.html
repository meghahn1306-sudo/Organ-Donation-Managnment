<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - LifeLink</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#4682B4;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
    font-size:28px;
}

.section-title{
    text-align:center;
    margin-top:50px;
    margin-bottom:30px;
    color:#4682B4;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0px 4px 15px rgba(0,0,0,0.1);
}

.btn-custom{
    background:#4682B4;
    color:white;
    border:none;
}

.btn-custom:hover{
    background:#5a9bd5;
}

.login-box{
    max-width:500px;
    margin:auto;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
<div class="container">
<a class="navbar-brand" href="index.html">Organ Donation Management</a>
<div class="ms-auto">
    <a href="index.html" class="btn btn-light">
        Home
    </a>
</div>

</div>
</nav>

<h2 class="section-title">Login Portal</h2>

<div class="container login-box">

<div class="card p-4">

<form id="loginForm">

<div class="mb-3">
<label>Email</label>
<input
type="text"
id="username"
class="form-control"
placeholder="Enter username">
</div>

<div class="mb-3">
<label>Password</label>
<input
type="password"
id="password"
class="form-control"
placeholder="Enter password">
</div>

<div class="mb-3">
<label>Select Role</label>

<select
id="userType"
class="form-control">

<option value="">
Select Role
</option>

<option value="admin">
Admin
</option>

<option value="user">
User
</option>

</select>

</div>

<<button
type="button"
onclick="login()"
class="btn btn-custom w-100">

Login

</button>

</form>

</div>

</div>
<script>

async function login(){

    let username =
    document.getElementById("username").value;

    let password =
    document.getElementById("password").value;

    let userType =
    document.getElementById("userType").value;


    // Role validation
    if(userType === ""){

        alert("Please Select Role");
        return;
    }


    // ADMIN LOGIN
    if(
        userType === "admin" &&
        username === "admin" &&
        password === "admin123"
    ){

        localStorage.setItem(
            "role",
            "admin"
        );

        alert(
            "Admin Login Successful"
        );

        window.location.href =
        "index.html";
    }


    // USER LOGIN
    else if(userType === "user"){

        // Save user in DB
        await fetch(
            "http://127.0.0.1:5000/api/user-login",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        localStorage.setItem(
            "role",
            "user"
        );

        alert(
            "User Login Successful"
        );

        window.location.href =
        "index.html";
    }

    else{

        alert(
            "Invalid Admin Credentials"
        );
    }
}

</script>
</body>
</html>
