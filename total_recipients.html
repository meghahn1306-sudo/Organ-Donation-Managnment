<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipients List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial, sans-serif;
}

.navbar{
    background:#4682B4;
}

.navbar-brand{
    color:white !important;
    font-weight:bold;
    font-size:22px;
}

.heading{
    text-align:center;
    color:#4682B4;
    margin:30px 0;
    font-weight:bold;
}

.total-box{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.btn-contact{
    background:#4682B4;
    color:white;
}

.btn-contact:hover{
    background:#5a9bd5;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar p-3">
<div class="container">
    <span class="navbar-brand">Organ Donation Management</span>

    <a href="index.html" class="btn btn-light">
        Home
    </a>
</div>
</nav>

<div class="container">

<h2 class="heading">Registered Recipients</h2>

<!-- TOTAL BOX -->
<div class="total-box">
    <h5>Total Recipients</h5>
    <h2 id="total">0</h2>
</div>

<!-- RECIPIENTS CONTAINER -->
<div class="row g-4" id="recipientContainer"></div>

</div>

<script>

async function loadRecipients() {

    try {

        const response = await fetch("http://127.0.0.1:5000/api/recipients");

        if (!response.ok) {
            throw new Error("Server Error: " + response.status);
        }

        const recipients = await response.json();

        document.getElementById("total").innerText = recipients.length;

        const container = document.getElementById("recipientContainer");
        container.innerHTML = "";

        // ✅ SAME AS DONORS PAGE METHOD
        const isAdmin = new URLSearchParams(window.location.search).get("admin");

        recipients.forEach(r => {

            let buttonHTML = "";

            const status = (r.organ_received || "").trim().toLowerCase();

            // ================= ADMIN VIEW =================
            if (isAdmin === "true") {

                if (status === "received") {

                    buttonHTML = `
                        <button class="btn btn-success w-100" disabled>
                            Received ✓
                        </button>
                    `;
                } else {

                    buttonHTML = `
                        <button class="btn btn-danger w-100"
                        onclick="markAsReceived(${r.recipient_id})">
                            Mark as Received
                        </button>
                    `;
                }
            }

            // ================= USER VIEW =================
            else {

                if (status === "received") {

                    buttonHTML = `
                        <button class="btn btn-secondary w-100" disabled>
                            Contact Disabled
                        </button>
                    `;
                } else {

                    buttonHTML = `
                        <a href="tel:${r.phone}" class="btn btn-contact w-100">
                            Contact
                        </a>
                    `;
                }
            }

            container.innerHTML += `
                <div class="col-md-4">
                    <div class="card p-3">

                        <h5>${r.full_name}</h5>
                        <hr>

                        <p><b>Age:</b> ${r.age}</p>
                        <p><b>Blood:</b> ${r.blood_group}</p>
                        <p><b>Required Organ:</b> ${r.required_organ}</p>
                        <p><b>Urgency:</b> ${r.urgency_level}</p>
                        <p><b>Condition:</b> ${r.medical_condition}</p>
                        <p><b>Phone:</b> ${r.phone}</p>

                        <p><b>Status:</b> ${r.organ_received || "Not Received"}</p>

                        ${buttonHTML}

                    </div>
                </div>
            `;
        });

    } catch (err) {
        console.log(err);
        document.getElementById("recipientContainer").innerHTML =
            "<h4 class='text-danger text-center'>Failed to load data</h4>";
    }
}


// ================= ADMIN ACTION =================
async function markAsReceived(recipientId) {

    const confirmMatch = confirm("Mark recipient as received?");

    if (!confirmMatch) return;

    try {

        const response = await fetch(
            `http://127.0.0.1:5000/api/recipient/${recipientId}/received`,
            { method: "PUT" }
        );

        const data = await response.json();

        alert(data.message);

        loadRecipients(); // refresh UI

    } catch (error) {
        console.log(error);
        alert("Failed to update recipient");
    }
}

window.onload = loadRecipients;

</script>
</body>
</html>
